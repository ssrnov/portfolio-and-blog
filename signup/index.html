<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | BuildLab Platform</title>
  <meta name="description" content="Create your free BuildLab account to build and publish your professional portfolio." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%238297FF'/><text x='16' y='22' font-family='sans-serif' font-size='18' font-weight='900' fill='%2308090B' text-anchor='middle'>B</text></svg>" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />

  <script>
    (function () {
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme) {
        document.documentElement.setAttribute('data-theme', storedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-brand" aria-label="BuildLab Home">
          <span class="gradient-text font-black" style="font-weight: 800; font-size: 1.25rem;">BuildLab</span>
          <span class="brand-badge">Platform</span>
        </a>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Publish your developer portfolio &amp; resume in minutes.</p>
      </div>

      <!-- 1-Click GitHub OAuth Button -->
      <button type="button" class="oauth-btn" id="github-oauth-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
        </svg>
        <span>Sign up with GitHub</span>
      </button>

      <div class="auth-divider">
        <span>OR REGISTRATION</span>
      </div>

      <!-- Registration Form -->
      <form id="signup-form" novalidate>
        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label for="signup-name" class="form-label">Full Name</label>
          <input
            type="text"
            id="signup-name"
            name="name"
            class="form-input"
            placeholder="Alex Morgan"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label for="signup-username" class="form-label">Choose Username Slug</label>
          <div style="display: flex; align-items: center; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); overflow: hidden;">
            <span style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); padding: 0 var(--space-3); background-color: var(--bg-secondary); border-right: 1px solid var(--border-color); height: 100%; display: flex; align-items: center;">
              /u/
            </span>
            <input
              type="text"
              id="signup-username"
              name="username"
              class="form-input"
              placeholder="alex"
              required
              style="border: none; border-radius: 0;"
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label for="signup-email" class="form-label">Email Address</label>
          <input
            type="email"
            id="signup-email"
            name="email"
            class="form-input"
            placeholder="developer@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-bottom: var(--space-6);">
          <label for="signup-password" class="form-label">Create Password</label>
          <input
            type="password"
            id="signup-password"
            name="password"
            class="form-input"
            placeholder="At least 8 characters"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span>Create Free Account</span>
          <span aria-hidden="true">&rarr;</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login" class="auth-link">Sign in</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
