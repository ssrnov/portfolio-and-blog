<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Folioryn</title>
  <meta name="description" content="Sign in to your Folioryn account to build, edit, and publish your professional portfolio." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23080909' stroke='%23292A2A' stroke-width='2'/><text x='16' y='22' font-family='sans-serif' font-size='18' font-weight='900' fill='%23F5F5F5' text-anchor='middle'>F</text></svg>" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />

  <script>
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  </script>
</head>
<body class="auth-page" style="background-color: var(--bg-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-4);">

  <div class="auth-container" style="max-width: 420px; width: 100%;">
    <div class="auth-card" style="background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--space-8); box-shadow: var(--shadow-lg);">
      <div class="auth-header" style="text-align: center; margin-bottom: var(--space-6);">
        <a href="/" class="auth-brand" aria-label="Folioryn Home" style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: var(--space-3); text-decoration: none;">
          <span style="width: 26px; height: 26px; border-radius: var(--radius-sm); background: #F5F5F5; color: #080909; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px;">F</span>
          <span style="font-weight: 800; font-size: 1.2rem; color: var(--text-primary); letter-spacing: -0.02em;">Folioryn</span>
        </a>
        <h1 class="auth-title" style="font-size: var(--text-2xl); font-weight: 800; color: var(--text-primary); margin: 0 0 4px 0;">Welcome back</h1>
        <p class="auth-subtitle" style="font-size: var(--text-xs); color: var(--text-secondary); margin: 0;">Sign in to your account to manage your portfolio and resume.</p>
      </div>

      <!-- GitHub OAuth Button -->
      <button type="button" class="btn btn-secondary" id="github-oauth-btn" style="width: 100%; justify-content: center; margin-bottom: var(--space-4); padding: 10px 16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
        </svg>
        <span>Continue with GitHub</span>
      </button>

      <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4);">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase;">or email</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>

      <!-- Email Login Form -->
      <form id="login-form" novalidate>
        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label for="login-email" class="form-label">Email Address</label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-input"
            placeholder="developer@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-bottom: var(--space-4);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label for="login-password" class="form-label" style="margin: 0;">Password</label>
            <button type="button" id="forgot-password-btn" class="auth-link" style="background: none; border: none; padding: 0; font-size: 11px; cursor: pointer; color: var(--text-secondary); text-decoration: underline;">
              Forgot password?
            </button>
          </div>
          <div style="position: relative;">
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
              style="padding-right: 40px;"
            />
            <button
              type="button"
              id="toggle-login-password-btn"
              aria-label="Toggle password visibility"
              style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: flex; align-items: center;"
            >
              <svg id="eye-icon-login" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2); padding: 10px 16px; font-weight: 700;">
          <span>Sign In to Dashboard</span>
          <span aria-hidden="true">&rarr;</span>
        </button>
      </form>

      <div class="auth-footer" style="text-align: center; margin-top: var(--space-6); font-size: var(--text-xs); color: var(--text-secondary);">
        Don't have an account yet? <a href="/signup/" class="auth-link" style="color: var(--text-primary); text-decoration: underline; font-weight: 600;">Create an account</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
