<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Article...</title>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const target = slug ? `/blog/sample-article/?slug=${encodeURIComponent(slug)}` : '/blog/';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">Redirecting to article...</p>
</body>
</html>
